[project]
name = "mavrykx"
version = "0.0.0"
description = "Self-hosted legal-work platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ag-ui-protocol==1.0.0",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.165.0",
    "opentelemetry-sdk==1.45.2",
    "pydantic==2.14.4",
    "pydantic-ai-harness[coder,codemode,dynamic-workflow,logfire,pgtask,skills]==0.75.0",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.9",
    "structlog==26.1.0",
    "typer==0.29.3",
]

[project.scripts]
mavrykx = "mavrykx.root.cli:main"

[dependency-groups]
dev = [
    "httpx==0.29.0",
    "hypothesis==6.170.17",
    "import-linter==2.17",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "modules", "tools", "tests", "migrations"]
extend-exclude = ["tests/negative", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG", "PTH", "TRY", "BLE", "RUF", "S"]
ignore = ["TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["mavrykx", "modules", "tools", "migrations", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S404", "S603", "S607"]
"tools/**" = ["S404", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = true
files = ["src", "modules", "tools", "migrations"]
mypy_path = "src"
exclude = ["tests/negative"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["."]
