name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: maverick_owner
          POSTGRES_PASSWORD: maverick
          POSTGRES_DB: mavrykx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maverick_owner -d mavrykx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MAVRYKX_DATABASE_URL: postgresql+asyncpg://maverick_owner:maverick@127.0.0.1:5432/mavrykx
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate
        run: uv run alembic upgrade head
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Verify
        run: uv run python -m tools.verify --full
